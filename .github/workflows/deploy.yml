name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  DEPLOY_DIR: /var/www/wetalk

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      # ---- 构建 ----

      - name: Build backend
        working-directory: backend
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o wetalk-server ./cmd

      - name: Build frontend (static export)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Package frontend for transfer
        run: tar -czf frontend-out.tar.gz -C frontend/out .

      # ---- 上传到服务器 ----

      - name: Copy backend binary
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: backend/wetalk-server
          target: ${{ env.DEPLOY_DIR }}/backend/
          strip_components: 1

      - name: Copy frontend static files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: frontend-out.tar.gz
          target: /tmp/

      # ---- 重启服务 ----

      - name: Restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # 后端
            chmod +x ${{ env.DEPLOY_DIR }}/backend/wetalk-server
            sudo systemctl restart wetalk-backend

            # 前端（nginx 静态托管）
            rm -rf ${{ env.DEPLOY_DIR }}/frontend/*
            tar -xzf /tmp/frontend-out.tar.gz -C ${{ env.DEPLOY_DIR }}/frontend/
            rm /tmp/frontend-out.tar.gz
            sudo systemctl reload nginx

            echo "✅ 部署完成"
