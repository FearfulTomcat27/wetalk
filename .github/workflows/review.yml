name: Claude Review - Specific Authors

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review-by-author:
    # Only run for PRs from specific authors
    if: |
      github.event.pull_request.author_association == 'OWNER'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review PR from Specific Author
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ secrets.ANTHROPIC_DEFAULT_OPUS_MODEL }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ secrets.ANTHROPIC_DEFAULT_SONNET_MODEL }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ secrets.ANTHROPIC_DEFAULT_HAIKU_MODEL }}
          CLAUDE_CODE_SUBAGENT_MODEL: ${{ secrets.CLAUDE_CODE_SUBAGENT_MODEL }}
          CLAUDE_CODE_EFFORT_LEVEL: ${{ secrets.CLAUDE_CODE_EFFORT_LEVEL }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            仓库: ${{ github.repository }}
            PR 编号: ${{ github.event.pull_request.number }}

            请对这个 Pull Request 进行一次彻底的代码审查。

            说明: PR 分支已经检出到当前工作目录,可以直接读取文件。

            由于该 PR 来自需要重点审查的特定作者,请额外关注以下方面:
            - 是否遵循项目编码规范(参见 CLAUDE.md)
            - 错误处理是否得当
            - 安全最佳实践
            - 测试覆盖情况
            - 文档是否完善

            请给出详细的反馈和改进建议。

            ## 语言要求(必须遵守)

            所有发布到 GitHub 的审查内容(包括每一条行内评论和最终的总结评论)都必须使用简体中文。
            代码标识符、文件路径、命令名、引用的代码片段等保持原文形式,不需要翻译。

            ## 如何发布审查结果(必须执行)

            你必须把审查结果发回 GitHub,否则审查结果不可见。
            请同时使用下面两种渠道,在收尾前必须调用这些工具:

            1. 对每一个具体的代码层面问题,调用
               `mcp__github_inline_comment__create_inline_comment`,在对应的文件/行号处发表评论。
               每条行内评论聚焦一个问题,尽量给出修复建议。评论正文必须使用中文。

            2. 所有行内评论发完后,通过 stdin 把 markdown 管道传给 `gh pr comment`,
               发一条整体总结评论(这样无需文件写入工具)。命令格式如下:

               gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file - <<'REVIEW_EOF'
               <你的完整 markdown 总结,使用中文>
               REVIEW_EOF

               总结内容应包含:
                 - 简短的结论(批准 / 需要修改 / 仅评论)。
                 - 做得好的地方。
                 - 行内已标注问题的汇总清单(便于一次性查看)。
                 - 没有具体行号的整体性问题(架构、测试缺失、文档等)。

            如果没有发现任何问题,仍然要发一条总结评论明确说明。

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"