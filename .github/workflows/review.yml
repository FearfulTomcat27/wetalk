name: Claude Review - Specific Authors

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review-by-author:
    # Only run for PRs from specific authors
    if: |
      github.event.pull_request.author_association == 'OWNER'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review PR from Specific Author
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ secrets.ANTHROPIC_DEFAULT_OPUS_MODEL }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ secrets.ANTHROPIC_DEFAULT_SONNET_MODEL }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ secrets.ANTHROPIC_DEFAULT_HAIKU_MODEL }}
          CLAUDE_CODE_SUBAGENT_MODEL: ${{ secrets.CLAUDE_CODE_SUBAGENT_MODEL }}
          CLAUDE_CODE_EFFORT_LEVEL: ${{ secrets.CLAUDE_CODE_EFFORT_LEVEL }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please provide a thorough review of this pull request.

            Note: The PR branch is already checked out in the current working directory.

            Since this is from a specific author that requires careful review,
            please pay extra attention to:
            - Adherence to project coding standards
            - Proper error handling
            - Security best practices
            - Test coverage
            - Documentation

            ## How to deliver your review (REQUIRED)

            You MUST publish your findings back to GitHub — otherwise the review is invisible.
            Use BOTH channels below. Do not finish your turn without calling these tools.

            1. For each concrete code-level issue, call
               `mcp__github_inline_comment__create_inline_comment` on the exact file/line.
               Keep each inline comment focused on one issue, with a suggested fix when possible.

            2. After all inline comments, post ONE overall summary by running:
               `gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file <path>`
               The summary should contain:
                 - A short verdict (approve / request changes / comment).
                 - Highlights of what looks good.
                 - A bulleted list of the issues you flagged inline (so reviewers see them in one place).
                 - Any concerns that did not map to a specific line (architecture, missing tests, docs, etc.).

            If you find no issues at all, still post the summary comment stating that explicitly.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(cat:*),Bash(mkdir:*),Bash(tee:*),Write,Read,Grep,Glob"