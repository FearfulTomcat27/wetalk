# WeTalk 后端配置示例
# 复制为 config.yaml 并填写实际值后启动服务

database:
  host: localhost
  port: 3306
  username: root
  password: ""
  dbname: wetalk
  charset: utf8mb4
  max_open_conns: 25
  max_idle_conns: 10

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0
  pool_size: 10

jwt:
  secret: "your-jwt-secret"
  expire_hours: 72

oss:
  endpoint: "oss-cn-shanghai.aliyuncs.com"
  bucket: "your-bucket-name"
  region: "cn-shanghai"
  access_key_id: "your-access-key-id"
  access_key_secret: "your-access-key-secret"
